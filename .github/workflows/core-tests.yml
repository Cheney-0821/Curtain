name: Core model checks
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run public source static preflight
        run: python scripts/static-check.py
      - name: Run Core model checks
        run: dotnet run --project tests/Curtain.Core.Tests/Curtain.Core.Tests.csproj -c Release